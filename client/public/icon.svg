<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1429"/>
      <stop offset="100%" stop-color="#06050a"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="rgba(245, 166, 35, 0.45)" stroke-width="8"/>

  <!-- Radiant Gold DECIBEL D & Audio Waves -->
  <g filter="url(#amberGlow)">
    <!-- Main D Pillar -->
    <rect x="116" y="124" width="48" height="264" rx="24" fill="url(#dbGold)"/>
    
    <!-- Outer Arc -->
    <path d="M 148 124 H 262 C 348 124 396 178 396 256 C 396 334 348 388 262 388 H 148" 
          fill="none" stroke="url(#dbGold)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Audio Equalizer Bars Inside D -->
    <rect x="206" y="212" width="22" height="88" rx="11" fill="#ffffff"/>
    <rect x="246" y="180" width="22" height="152" rx="11" fill="url(#dbGold)"/>
    <rect x="286" y="222" width="22" height="68" rx="11" fill="#f59e0b"/>

    <!-- Glowing Brand Dot -->
    <circle cx="426" cy="382" r="22" fill="#f5a623"/>
  </g>
</svg>
